<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>SQUELLY Werbemotiv</title>
<style>
/*FONTS*/
:root{
  --navy:#14315c; --blue:#3a8ccd; --sky:#d5eef8; --ground:#e9f3fa;
  --ink-soft:#4a6484;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#333;display:flex;flex-direction:column;align-items:center;gap:36px;padding:36px}

.ad{
  width:1080px;height:1080px;position:relative;overflow:hidden;flex-shrink:0;
  background:
    radial-gradient(78% 52% at 78% 68%, #ffffff 0%, rgba(255,255,255,0) 62%),
    linear-gradient(163deg, #f4fafd 0%, var(--ground) 46%, #d3e8f5 100%);
  font-family:'Barlow',system-ui,sans-serif;color:var(--navy);
  display:flex;flex-direction:column;
}
/* Konturmotiv der Marke, sehr zurückhaltend — Textur statt Dekoration */
.tex{position:absolute;inset:-6%;opacity:.2;pointer-events:none;
  -webkit-mask-image:radial-gradient(66% 58% at 50% 46%,#000,transparent 84%);
  mask-image:radial-gradient(66% 58% at 50% 46%,#000,transparent 84%)}
.tex svg{width:100%;height:100%}

.inner{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;padding:64px 66px 56px}

/* ---------- Markenzeile ---------- */
.top{display:flex;align-items:center;gap:15px}
.logo{width:44px;height:auto;display:block;border-radius:3px}
.wm{font-family:'Barlow Semi Condensed';font-weight:800;font-size:27px;letter-spacing:.19em;
  text-indent:.19em;color:var(--navy)}
.tag{margin-left:auto;font-weight:600;font-size:17px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--blue);border:1.5px solid rgba(58,140,205,.42);padding:8px 16px;border-radius:4px}

/* ---------- Schlagzeile ---------- */
.head{
  font-family:'Barlow Semi Condensed';font-weight:800;
  font-size:112px;line-height:.93;letter-spacing:-.008em;
  margin-top:44px;text-transform:uppercase;
}
.head .big{font-size:132px;color:var(--blue)}
.sub{font-size:27px;line-height:1.42;color:var(--ink-soft);margin-top:22px;max-width:17ch;font-weight:400}
.sub b{font-weight:600;color:var(--navy)}

/* ---------- Produktfoto ---------- */
/* Der Freisteller liegt auf Weiß. Multiply lässt das Weiß im Hintergrund
   verschwinden, ohne harte Kante — deshalb kein sichtbarer Kasten. */
.shot{
  position:absolute;right:-54px;bottom:88px;width:648px;height:648px;z-index:1;
  mix-blend-mode:multiply;
}
.shot img{width:100%;height:100%;object-fit:contain;display:block}

/* ---------- Belege ---------- */
.proof{margin-top:auto;display:flex;gap:10px;flex-wrap:wrap;max-width:560px}
.pf{
  display:flex;align-items:center;gap:9px;
  background:rgba(255,255,255,.86);border:1px solid rgba(20,49,92,.13);
  border-radius:6px;padding:11px 15px;font-size:20px;font-weight:600;
  box-shadow:0 2px 10px rgba(20,49,92,.06);
}
.pf svg{width:18px;height:18px;color:var(--blue);flex-shrink:0}

/* ---------- Abschluss ---------- */
.foot{display:flex;align-items:flex-end;gap:20px;margin-top:26px}
.cta{
  display:inline-flex;align-items:center;gap:13px;
  background:var(--navy);color:#fff;font-weight:700;font-size:29px;
  padding:22px 38px;border-radius:7px;box-shadow:0 10px 26px rgba(20,49,92,.28);
}
.cta svg{width:24px;height:24px}
.note{font-size:15.5px;color:#7b8ea6;line-height:1.45;max-width:26ch;font-weight:400}
</style>
</head>
<body>

<div class="ad">
  <div class="tex">
    <svg viewBox="0 0 1080 1080" preserveAspectRatio="none">
      <defs><path id="t1" d="M0,-60 C120,180 -110,360 40,600 C180,830 -50,960 60,1180"/></defs>
      <g fill="none" stroke="#3a8ccd" stroke-width="1.5">
        <use href="#t1" x="-40"/><use href="#t1" x="50"/><use href="#t1" x="130"/>
        <use href="#t1" x="210"/><use href="#t1" x="300"/><use href="#t1" x="380"/>
        <use href="#t1" x="460"/><use href="#t1" x="550"/><use href="#t1" x="630"/>
        <use href="#t1" x="710"/><use href="#t1" x="800"/><use href="#t1" x="880"/>
        <use href="#t1" x="960"/><use href="#t1" x="1050"/><use href="#t1" x="1130"/>
      </g>
    </svg>
  </div>

  <div class="shot"><img src="/*IMG*/" alt="Kabelloser Handvakuumierer mit vakuumierten Beuteln und frischem Gemüse"></div>

  <div class="inner">
    <div class="top">
      <svg class="logo" viewBox="0 0 200 360" aria-hidden="true">
        <defs>
          <clipPath id="lc"><rect x="1" y="1" width="198" height="358" rx="2"/></clipPath>
          <path id="la" d="M0,-30 C40,52 -32,104 14,168 C56,230 -16,276 20,340 C38,376 6,388 12,412"/>
          <path id="lb" d="M0,-30 C22,60 -44,96 8,164 C44,226 -28,268 14,336 C30,372 -2,384 6,412"/>
        </defs>
        <g clip-path="url(#lc)">
          <rect width="200" height="360" fill="#fff"/>
          <g fill="none" stroke="#3a8ccd" stroke-linecap="round">
            <use href="#la" x="18" stroke-width="26"/><use href="#lb" x="72" stroke-width="17"/>
            <use href="#la" x="118" stroke-width="34"/><use href="#lb" x="176" stroke-width="21"/>
          </g>
          <g fill="none" stroke="#14315c" stroke-width="5">
            <use href="#la" x="2"/><use href="#lb" x="38"/><use href="#la" x="72"/>
            <use href="#lb" x="110"/><use href="#la" x="146"/><use href="#lb" x="184"/>
          </g>
        </g>
        <rect x="1" y="1" width="198" height="358" rx="2" fill="none" stroke="#14315c" stroke-width="4"/>
      </svg>
      <span class="wm">SQUELLY</span>
      <span class="tag">Küche</span>
    </div>

    <h1 class="head">Reste halten<br><span class="big">5× länger</span></h1>
    <p class="sub">Ein Knopfdruck, <b>fünf Sekunden</b> — und die halbe Avocado
      überlebt die Woche.</p>

    <div class="proof">
      <span class="pf">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        In 5 Sekunden versiegelt
      </span>
      <span class="pf">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        30 wiederverwendbare Beutel dabei
      </span>
      <span class="pf">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        Akku, lädt per USB-C
      </span>
    </div>

    <div class="foot">
      <span class="cta">Preis auf Amazon prüfen
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
             stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </span>
      <span class="note">Anzeige · Als Amazon-Partner verdienen wir an qualifizierten Verkäufen.</span>
    </div>
  </div>
</div>

</body>
</html>
