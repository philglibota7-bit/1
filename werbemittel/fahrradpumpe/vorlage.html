<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>SQUELLY — Fahrradpumpe, drei Varianten</title>
<style>
/*FONTS*/
:root{
  --navy:#14315c; --blue:#3a8ccd; --sky:#d5eef8; --ink-soft:#4e6785;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#2a2a2a;display:flex;flex-direction:column;align-items:center;gap:34px;padding:34px}

/* ============================================================
   Dieselbe Bühne wie die übrige Serie: Wand, Fläche, warmes
   Streiflicht von rechts, kühler Gegenpol links.
   ============================================================ */
.ad{
  width:1080px;height:1080px;position:relative;overflow:hidden;flex-shrink:0;
  font-family:'Barlow',system-ui,sans-serif;color:var(--navy);
  background:linear-gradient(178deg,#eef4f9 0%,#e4edf4 46%,#dae5ee 62%,#cfdce7 100%);
  isolation:isolate;
}
.surface{position:absolute;left:0;right:0;bottom:0;height:34%;z-index:0;
  background:linear-gradient(180deg,#c9d8e4 0%,#d6e2ec 22%,#dfe8f0 100%)}
.surface::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.85) 30%,rgba(255,255,255,.85) 70%,transparent)}
.sun{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(46% 42% at 84% 12%, rgba(255,227,196,.92) 0%, rgba(255,227,196,0) 68%),
    radial-gradient(70% 50% at 92% 46%, rgba(255,214,170,.42) 0%, rgba(255,214,170,0) 70%)}
.cool{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(58% 54% at 2% 74%, rgba(58,140,205,.26) 0%, rgba(58,140,205,0) 70%)}
.tex{position:absolute;inset:-6%;z-index:1;opacity:.16;pointer-events:none;
  -webkit-mask-image:radial-gradient(64% 56% at 46% 42%,#000,transparent 82%);
  mask-image:radial-gradient(64% 56% at 46% 42%,#000,transparent 82%)}
.tex svg{width:100%;height:100%}
.vig{position:absolute;inset:0;z-index:6;pointer-events:none;
  background:radial-gradient(78% 72% at 50% 44%, transparent 58%, rgba(28,54,88,.16) 100%)}

.stage{position:absolute;z-index:3;mix-blend-mode:multiply}
.stage img{width:100%;height:100%;object-fit:contain;display:block}
.contact{position:absolute;z-index:2;border-radius:50%;
  background:radial-gradient(closest-side, rgba(22,45,76,.5), rgba(22,45,76,0) 76%)}

/* ============================================================
   Wirkzeichen dieses Produkts: der Druck steigt.
   Ein Manometer-Bogen — dieselbe Kreissprache wie Sog, Impuls
   und Licht, aber unverwechselbar der Pumpe zugeordnet.
   ============================================================ */
.fx{position:absolute;z-index:2;pointer-events:none}
.fx svg{width:100%;height:100%;display:block;overflow:visible}
.fx .aura{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle,rgba(58,140,205,.26) 0%,rgba(58,140,205,.1) 36%,rgba(58,140,205,0) 64%)}

.inner{position:relative;z-index:5;display:flex;flex-direction:column;height:100%;
  padding:62px 64px 54px}
.top{display:flex;align-items:center;gap:15px}
.logo{width:44px;height:auto;display:block;border-radius:3px;
  box-shadow:0 3px 12px rgba(20,49,92,.18)}
.wm{font-family:'Barlow Semi Condensed';font-weight:800;font-size:27px;letter-spacing:.19em;
  text-indent:.19em}
.tag{margin-left:auto;font-weight:600;font-size:16px;letter-spacing:.14em;text-transform:uppercase;
  color:#7a5a38;background:#fff;border:1px solid rgba(255,206,158,.95);
  padding:8px 16px;border-radius:99px;box-shadow:0 3px 12px rgba(120,80,40,.14)}

.said{margin-top:40px;font-size:25px;font-weight:500;color:var(--ink-soft);
  line-height:1.4;max-width:19ch}
.head{font-family:'Barlow Semi Condensed';font-weight:800;font-size:98px;line-height:.94;
  letter-spacing:-.01em;margin-top:14px;text-transform:uppercase;max-width:13ch}
.head .big{color:var(--blue)}

.proof{margin-top:auto;display:flex;flex-direction:column;align-items:flex-start;gap:9px}
.pf{display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.9);
  border-radius:99px;padding:10px 18px 10px 13px;font-size:19px;font-weight:600;
  box-shadow:0 4px 16px rgba(20,49,92,.1)}
.pf svg{width:17px;height:17px;color:var(--blue);flex-shrink:0}

.foot{display:flex;flex-direction:column;align-items:flex-start;gap:13px;margin-top:22px}
.cta{display:inline-flex;align-items:center;gap:13px;background:var(--navy);color:#fff;
  font-weight:700;font-size:28px;padding:21px 36px;border-radius:99px;
  box-shadow:0 12px 30px rgba(20,49,92,.34);white-space:nowrap}
.cta svg{width:23px;height:23px}
.note{font-size:15px;color:#6d8299;line-height:1.4;max-width:44ch}

/* Das Produkt wird gehalten — es läuft unten aus dem Bild, statt
   auf einer Fläche zu stehen. Deshalb hier kein Aufsetzschatten. */
/* ---------- Variante A: Tempo ---------- */
/* Quadratisch wie die Bildvorlage: sonst entsteht durch das Einpassen
   ein Leerrand, und die Schnittkante der Hand wird sichtbar. */
#va .stage  {right:-96px;bottom:-40px;width:650px;height:650px}
#va .fx     {left:392px;bottom:250px;width:630px;height:630px}
/* Der Sekundenzähler trägt die Anzeige — deshalb groß und für sich */
#va .head{font-size:118px;max-width:9ch}

/* ---------- Variante B: Lieferumfang ---------- */
#vb .stage  {right:-34px;bottom:-26px;width:790px;height:790px}
#vb .fx     {left:336px;bottom:268px;width:540px;height:540px;opacity:.7}
#vb .head{font-size:92px;max-width:12ch}

/* ---------- Variante C: Ventile ---------- */
#vc .stage  {right:-84px;bottom:-40px;width:632px;height:632px}
#vc .fx     {left:406px;bottom:268px;width:580px;height:580px}
#vc .head{font-family:'Barlow Semi Condensed';font-size:86px;line-height:1.02;max-width:11ch}
/* Die drei Ventilnamen als eigene Zeilen — das ist die Botschaft */
#vc .head span{display:block}
#vc .head .b2{color:var(--blue)}


/* ---------- Variante D: gespiegelt ---------- */
/* Produkt links, Text rechts. Gleiche Bühne, anderer Rhythmus —
   im Feed fällt ein gespiegeltes Motiv neben den anderen auf. */
#vd .inner{align-items:flex-end;text-align:right}
#vd .top{width:100%}
#vd .said,#vd .head{max-width:none}
#vd .said{max-width:20ch}
#vd .head{font-size:96px;max-width:12ch}
#vd .proof{align-items:flex-end}
#vd .pf{flex-direction:row-reverse;padding:10px 13px 10px 18px}
#vd .foot{align-items:flex-end;text-align:right}
#vd .note{max-width:40ch}
#vd .stage{left:-70px;bottom:-30px;width:660px;height:660px}
#vd .fx{right:404px;bottom:262px;width:600px;height:600px}
#vd .sun{background:
  radial-gradient(46% 42% at 16% 12%, rgba(255,227,196,.92) 0%, rgba(255,227,196,0) 68%),
  radial-gradient(70% 50% at 8% 46%, rgba(255,214,170,.42) 0%, rgba(255,214,170,0) 70%)}
#vd .cool{background:radial-gradient(58% 54% at 98% 74%, rgba(58,140,205,.26) 0%, rgba(58,140,205,0) 70%)}

/* ---------- Variante E: die Zahlen ---------- */
/* Drei geprüfte Werte tragen die Anzeige. Kein Bildwitz, nur Fakten —
   funktioniert bei Leuten, die schon wissen, was sie suchen. */
#ve .head{font-size:74px;max-width:14ch;margin-top:8px}
#ve .stage{right:-104px;bottom:-34px;width:596px;height:596px}
#ve .fx{left:432px;bottom:300px;width:520px;height:520px;opacity:.8}
.zahlen{display:flex;gap:0;margin-top:30px;max-width:620px}
.zahlen div{flex:1;padding-right:22px;border-right:1px solid rgba(20,49,92,.16)}
.zahlen div:last-child{border-right:none}
.zahlen b{display:block;font-family:'Barlow Semi Condensed';font-weight:800;font-size:76px;
  line-height:.92;color:var(--blue);letter-spacing:-.02em}
.zahlen span{display:block;font-size:17px;font-weight:600;color:var(--ink-soft);margin-top:7px;
  line-height:1.3;max-width:11ch}

.cap{color:#bbb;font-family:monospace;font-size:13px;margin-bottom:-22px;align-self:flex-start}
</style>
</head>
<body>
<!--ADS-->
</body>
</html>
