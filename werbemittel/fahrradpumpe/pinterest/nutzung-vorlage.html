<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>SQUELLY — Pinterest, vier Entwürfe mit Anwendungsbild</title>
<style>
/*FONTS*/
:root{--navy:#14315c; --blue:#3a8ccd; --ink:#4e6785}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#222;display:flex;flex-wrap:wrap;gap:30px;padding:30px;align-items:flex-start}
.cap{color:#bbb;font-family:monospace;font-size:13px;width:100%;margin-bottom:-20px}

/* Diese vier zeigen das Gerät nicht freigestellt, sondern bei der Arbeit:
   am Rahmen, auf dem Weg in die Satteltasche, im Rucksack, neben einem
   Handy. Es sind Ausschnitte der Herstellerfotos — nichts nachgebaut. */
.pin{width:1000px;height:1500px;position:relative;overflow:hidden;flex-shrink:0;
  font-family:'Barlow',system-ui,sans-serif;isolation:isolate}
.foto{display:block;object-fit:cover}
.logo{height:auto;display:block;flex-shrink:0}
.wm{font-family:'Barlow Semi Condensed';font-weight:800;letter-spacing:.19em;text-indent:.19em}

/* ══════════════════════════════════════════════════════════════════
   ENTWURF 6 — DREI PLÄTZE
   Drei Fotos untereinander, jedes mit einer Zeile daneben. Beantwortet
   die Frage, die man vor dem Kauf wirklich hat: wo tue ich das Ding hin?
   ══════════════════════════════════════════════════════════════════ */
#u1{background:#fff;color:var(--navy)}
#u1 .kopf{display:flex;align-items:center;gap:14px;padding:56px 58px 0}
#u1 .logo{width:44px;border-radius:3px}
#u1 .wm{font-size:26px}
#u1 .marke{margin-left:auto;font-size:14px;font-weight:600;letter-spacing:.15em;
  text-transform:uppercase;color:#7b8ea3;border:1px solid #d8e2ea;padding:8px 15px;
  border-radius:99px}
#u1 h1{font-family:'Barlow Semi Condensed';font-weight:800;text-transform:uppercase;
  font-size:78px;line-height:.92;letter-spacing:-.012em;margin:34px 58px 0}
#u1 h1 em{font-style:normal;color:var(--blue)}
#u1 .platz{display:flex;gap:28px;align-items:center;margin:0 58px;padding:20px 0;
  border-top:1px solid #e8eef3}
#u1 .platz:first-of-type{margin-top:26px}
#u1 .foto{width:272px;height:272px;border-radius:18px;flex-shrink:0}
#u1 .platz b{display:block;font-family:'Barlow Semi Condensed';font-weight:800;
  text-transform:uppercase;font-size:46px;line-height:1;letter-spacing:-.01em}
#u1 .platz p{font-size:24px;color:#61748b;line-height:1.34;margin-top:12px}
#u1 .fuss{position:absolute;left:58px;right:58px;bottom:46px}
#u1 .knopf{display:flex;align-items:center;justify-content:center;gap:13px;
  background:var(--navy);color:#fff;font-weight:700;font-size:31px;padding:25px;
  border-radius:99px;white-space:nowrap}
#u1 .knopf svg{width:24px;height:24px}
#u1 .klein{font-size:15px;color:#93a3b5;line-height:1.42;margin-top:14px;text-align:center}

/* ══════════════════════════════════════════════════════════════════
   ENTWURF 7 — GRÖSSENVERGLEICH
   Ein Foto, das die Frage nach der Größe in einer Sekunde beantwortet.
   Es läuft oben rechts aus dem Blatt, die Schrift steht darunter.
   ══════════════════════════════════════════════════════════════════ */
#u2{background:linear-gradient(172deg,#1d3a5e 0%,#132a47 56%,#0c1c30 100%);color:#e6eef7}
#u2 .foto{position:absolute;right:0;top:0;width:640px;height:auto;z-index:2;
  border-bottom-left-radius:30px}
#u2 .kopf{position:absolute;left:58px;top:56px;z-index:4;display:flex;align-items:center;gap:13px}
#u2 .logo{width:44px;border-radius:3px}
#u2 .wm{font-size:26px;color:#fff}
#u2 .marke{position:absolute;left:58px;top:158px;z-index:4;font-family:ui-monospace,Menlo,monospace;
  font-size:15px;letter-spacing:.16em;color:#8fc4ee}
#u2 h1{position:absolute;left:58px;right:58px;top:966px;z-index:4;
  font-family:'Barlow Semi Condensed';font-weight:800;text-transform:uppercase;
  font-size:96px;line-height:.9;letter-spacing:-.015em;color:#fff}
#u2 h1 em{font-style:normal;color:#8fc4ee}
#u2 .unter{position:absolute;left:58px;top:1176px;z-index:4;font-size:27px;
  color:rgba(230,238,247,.72);line-height:1.34;max-width:26ch}
#u2 .fuss{position:absolute;left:58px;right:58px;bottom:48px;z-index:4}
#u2 .knopf{display:inline-flex;align-items:center;gap:13px;background:#fff;color:var(--navy);
  font-weight:700;font-size:31px;padding:24px 42px;border-radius:99px;white-space:nowrap}
#u2 .knopf svg{width:24px;height:24px}
#u2 .klein{font-size:15px;color:rgba(230,238,247,.45);line-height:1.42;margin-top:16px;
  max-width:50ch}

/* ══════════════════════════════════════════════════════════════════
   ENTWURF 8 — SZENE AM RAD
   Das Foto füllt die obere Hälfte, die Schrift sitzt im Verlauf darin.
   Kein Studio, kein Freisteller — das Gerät dort, wo es hingehört.
   ══════════════════════════════════════════════════════════════════ */
#u3{background:#0f2743;color:#fff}
#u3 .buehne{position:absolute;left:0;right:0;top:0;height:1000px;z-index:1;overflow:hidden}
#u3 .foto{width:100%;height:100%;object-position:52% 50%}
#u3 .schleier{position:absolute;left:0;right:0;top:440px;height:560px;z-index:2;
  background:linear-gradient(180deg, rgba(15,39,67,0) 0%, rgba(15,39,67,.72) 52%,
    rgba(15,39,67,.97) 88%, #0f2743 100%)}
#u3 .oben{position:absolute;left:0;right:0;top:0;height:220px;z-index:2;
  background:linear-gradient(180deg, rgba(8,24,42,.6) 0%, rgba(8,24,42,0) 100%)}
#u3 .kopf{position:absolute;left:58px;right:58px;top:56px;z-index:4;
  display:flex;align-items:center;gap:13px}
#u3 .logo{width:44px;border-radius:3px}
#u3 .wm{font-size:26px;color:#fff}
#u3 .marke{margin-left:auto;font-size:14px;font-weight:600;letter-spacing:.15em;
  text-transform:uppercase;color:#fff;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.32);padding:8px 15px;border-radius:99px}
#u3 h1{position:absolute;left:58px;right:58px;top:706px;z-index:4;
  font-family:'Barlow Semi Condensed';font-weight:800;text-transform:uppercase;
  font-size:102px;line-height:.9;letter-spacing:-.015em}
#u3 h1 em{font-style:normal;color:#8fc4ee}
#u3 .zeilen{position:absolute;left:58px;right:58px;top:1052px;z-index:4}
#u3 .zeilen div{display:flex;gap:16px;align-items:flex-start;padding:15px 0;
  border-top:1px solid rgba(255,255,255,.18);font-size:25px;line-height:1.3;
  color:rgba(255,255,255,.84)}
#u3 .zeilen svg{width:24px;height:24px;color:#8fc4ee;flex-shrink:0;margin-top:5px}
#u3 .fuss{position:absolute;left:58px;right:58px;bottom:48px;z-index:4}
#u3 .knopf{display:flex;align-items:center;justify-content:center;gap:13px;background:#8fc4ee;
  color:#0b2340;font-weight:700;font-size:31px;padding:25px;border-radius:99px;white-space:nowrap}
#u3 .knopf svg{width:24px;height:24px}
#u3 .klein{font-size:15px;color:rgba(255,255,255,.45);line-height:1.42;margin-top:14px;
  text-align:center}

/* ══════════════════════════════════════════════════════════════════
   ENTWURF 9 — WAS SIE TUT
   Ein breites Anwendungsbild, darunter vier Kacheln mit den Aufgaben.
   Für Leute, die vor dem Klick wissen wollen, was das Gerät kann.
   ══════════════════════════════════════════════════════════════════ */
#u4{background:#f5f2ec;color:var(--navy)}
#u4 .kopf{display:flex;align-items:center;gap:14px;padding:56px 56px 0}
#u4 .logo{width:44px}
#u4 .wm{font-size:26px}
#u4 .marke{margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-size:14px;
  letter-spacing:.17em;text-transform:uppercase;color:#96825f}
#u4 h1{font-family:'Barlow Semi Condensed';font-weight:800;text-transform:uppercase;
  font-size:88px;line-height:.92;letter-spacing:-.012em;margin:30px 56px 0}
#u4 h1 em{font-style:normal;color:#b3853f}
#u4 .bild{margin:30px 56px 0;height:600px;border-radius:22px;overflow:hidden}
#u4 .foto{width:100%;height:100%;object-position:50% 44%}
#u4 .kacheln{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:26px 56px 0}
#u4 .kacheln div{background:#fff;border:1px solid #e7e0d3;border-radius:18px;padding:24px 26px}
#u4 .kacheln b{display:block;font-family:'Barlow Semi Condensed';font-weight:800;
  text-transform:uppercase;font-size:38px;line-height:1;letter-spacing:-.01em}
#u4 .kacheln span{display:block;font-size:21px;color:#6d7f94;line-height:1.3;margin-top:10px}
#u4 .fuss{position:absolute;left:56px;right:56px;bottom:46px}
#u4 .knopf{display:inline-flex;align-items:center;gap:14px;font-weight:700;font-size:34px;
  color:var(--navy);border-bottom:5px solid #b3853f;padding-bottom:11px;white-space:nowrap}
#u4 .knopf svg{width:27px;height:27px}
#u4 .klein{font-size:15px;color:#96825f;line-height:1.42;margin-top:22px;max-width:52ch}
</style>
</head>
<body>
<!--PINS-->
</body>
</html>
