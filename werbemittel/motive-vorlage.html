<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>SQUELLY Werbemotive</title>
<style>
/*FONTS*/
:root{
  --navy:#14315c; --blue:#3a8ccd; --sky:#d5eef8; --ground:#e9f3fa;
  --ink-soft:#4a6484;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#333;display:flex;flex-direction:column;align-items:center;gap:34px;padding:34px}

/* ============================================================
   Ein Layout für alle drei Motive — gleiche Marke, gleiche Regeln.
   Unterschiedlich sind nur Foto, Kategorie und Text.
   ============================================================ */
.ad{
  width:1080px;height:1080px;position:relative;overflow:hidden;flex-shrink:0;
  background:
    radial-gradient(78% 52% at 78% 68%, #ffffff 0%, rgba(255,255,255,0) 62%),
    linear-gradient(163deg, #f4fafd 0%, var(--ground) 46%, #d3e8f5 100%);
  font-family:'Barlow',system-ui,sans-serif;color:var(--navy);
}
/* Konturmotiv der Marke, sehr zurückhaltend — Textur statt Dekoration */
.tex{position:absolute;inset:-6%;opacity:.2;pointer-events:none;
  -webkit-mask-image:radial-gradient(66% 58% at 50% 46%,#000,transparent 84%);
  mask-image:radial-gradient(66% 58% at 50% 46%,#000,transparent 84%)}
.tex svg{width:100%;height:100%}

.inner{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;
  padding:64px 66px 56px}

/* ---------- Markenzeile ---------- */
.top{display:flex;align-items:center;gap:15px}
.logo{width:44px;height:auto;display:block;border-radius:3px}
.wm{font-family:'Barlow Semi Condensed';font-weight:800;font-size:27px;letter-spacing:.19em;
  text-indent:.19em;color:var(--navy)}
.tag{margin-left:auto;font-weight:600;font-size:17px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--blue);border:1.5px solid rgba(58,140,205,.42);padding:8px 16px;border-radius:4px}

/* ---------- Schlagzeile ---------- */
.head{font-family:'Barlow Semi Condensed';font-weight:800;
  font-size:106px;line-height:.93;letter-spacing:-.008em;margin-top:44px;text-transform:uppercase}
.head .big{color:var(--blue)}
.sub{font-size:26px;line-height:1.42;color:var(--ink-soft);margin-top:20px;max-width:17ch}
.sub b{font-weight:600;color:var(--navy)}

/* ---------- Produktfoto ---------- */
/* Die Freisteller liegen auf Weiß. Multiply lässt das Weiß im Untergrund
   verschwinden — dadurch keine sichtbare Bildkante. */
.shot{position:absolute;z-index:1;mix-blend-mode:multiply}
.shot img{width:100%;height:100%;object-fit:contain;display:block}
/* Jedes Produkt hat eine andere Silhouette und braucht seinen eigenen Stand */
#ad1 .shot{right:-54px;bottom:88px;width:648px;height:648px}
#ad2 .shot{right:-30px;bottom:96px;width:610px;height:610px}
#ad3 .shot{right:2px;bottom:70px;width:566px;height:766px}

/* ---------- Belege ---------- */
.proof{margin-top:auto;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.pf{display:flex;align-items:center;gap:9px;
  background:rgba(255,255,255,.86);border:1px solid rgba(20,49,92,.13);
  border-radius:6px;padding:11px 15px;font-size:20px;font-weight:600;
  box-shadow:0 2px 10px rgba(20,49,92,.06)}
.pf svg{width:18px;height:18px;color:var(--blue);flex-shrink:0}

/* ---------- Abschluss ---------- */
.foot{display:flex;align-items:flex-end;gap:20px;margin-top:26px}
.cta{display:inline-flex;align-items:center;gap:13px;background:var(--navy);color:#fff;
  font-weight:700;font-size:29px;padding:22px 38px;border-radius:7px;
  box-shadow:0 10px 26px rgba(20,49,92,.28);white-space:nowrap}
.cta svg{width:24px;height:24px}
.note{font-size:15.5px;color:#7b8ea6;line-height:1.45;max-width:24ch}

.cap{color:#bbb;font-family:monospace;font-size:13px;margin-bottom:-22px;align-self:flex-start}
</style>
</head>
<body>
<!--ADS-->
</body>
</html>
